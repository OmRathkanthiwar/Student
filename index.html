<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Task Manager</title>

<style>
    body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display:flex;
    justify-content:center;
    margin-top:50px;
    min-height:100vh;
    }

    .container{
    width:400px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

    h2{
    text-align:center;
    color:#5a3fa3;
}

button{
    padding:8px 12px;
    cursor:pointer;
    border:none;
    border-radius:5px;
    background:#667eea;
    color:white;
}

button:hover{
    background:#5a67d8;
}

li{
    background:#f0f2ff;
    margin:8px 0;
    padding:10px;
    border-radius:5px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

#taskCount{
    text-align:center;
    color:#666;
    font-weight:bold;
}

    ul{
        list-style:none;
        padding:0;
        margin-top:20px;
    }

   
    .completed{
        text-decoration:line-through;
        color:gray;
    }

    .actions button{
        margin-left:5px;
    }

    #taskCount{
    text-align:center;
    color:#666;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
    <h2>Student Task Manager - Jenkins Test</h2>
    <p id="taskCount">Total Tasks: 0</p>

    <input type="text" id="taskInput" placeholder="Enter task">
    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>
</div>

<script>

function addTask(){

    let input=document.getElementById("taskInput");

    if(input.value=="")
        return;

    let li=document.createElement("li");

    let span=document.createElement("span");
    span.innerText=input.value;

    let actions=document.createElement("div");
    actions.className="actions";

    let complete=document.createElement("button");
    complete.innerText="Done";

    complete.onclick=function(){
        span.classList.toggle("completed");
    }

    let del=document.createElement("button");
    del.innerText="Delete";

    del.onclick=function(){
        li.remove();
        updateTaskCount();
    }

    actions.appendChild(complete);
    actions.appendChild(del);

    li.appendChild(span);
    li.appendChild(actions);

    document.getElementById("taskList").appendChild(li);

    input.value="";
    updateTaskCount();
}

function updateTaskCount(){
    let count=document.querySelectorAll("#taskList li").length;
    document.getElementById("taskCount").innerText="Total Tasks: "+count;
}

</script>

</body>
</html>
